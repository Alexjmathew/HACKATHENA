<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}GST Fraud Detection{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head><body>
<header class="top"><div class="wrap bar">
  <a class="brand" href="{{ url_for('index') }}"><span class="dot"></span>GST Fraud Detection <small>Neural Network</small></a>
  <nav><a href="{{ url_for('index') }}">New scan</a></nav>
</div></header>
<main class="wrap">
{% with msgs = get_flashed_messages() %}{% for m in msgs %}<div class="alert">{{ m }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="wrap foot">Scores come from a neural network trained on synthetic data. Flags are leads for review, not proof of fraud.</footer>
</body></html>
